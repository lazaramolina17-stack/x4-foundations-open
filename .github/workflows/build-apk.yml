name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Godot
        run: |
          wget -nv https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Android SDK
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          sudo mkdir -p /opt/android-sdk
          wget -nv https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip -d /opt/android-sdk/
          sudo mkdir -p /opt/android-sdk/latest
          sudo mv /opt/android-sdk/cmdline-tools/* /opt/android-sdk/latest/ 2>/dev/null
          sudo rmdir /opt/android-sdk/cmdline-tools 2>/dev/null
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          yes | /opt/android-sdk/latest/bin/sdkmanager --sdk_root=/opt/android-sdk 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools' 'ndk;25.2.9519653' 2>&1 | tail -10
          echo "SDK installed"

      - name: Install Godot export templates
        run: |
          wget -nv https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.3.stable
          if [ -d ~/.local/share/godot/export_templates/4.3.stable/templates ]; then
            mv ~/.local/share/godot/export_templates/4.3.stable/templates/* ~/.local/share/godot/export_templates/4.3.stable/
            rm -rf ~/.local/share/godot/export_templates/4.3.stable/templates
          fi
          echo "Templates installed"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=X4, OU=Dev, O=Game, L=Unknown, ST=Unknown, C=XX"
          ls -la android.keystore

      - name: Build APK
        run: |
          mkdir -p build
          # First import to initialize .godot folder
          godot --headless --path . --import 2>&1 || true
          ls -la export_presets.cfg
          head -10 export_presets.cfg
          # Export
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          godot --headless --path . --export-debug "Android" build/game-debug.apk 2>&1 || true
          ls -lh build/ 2>&1 || echo "No build output"

      - uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: build/game-debug.apk
          if-no-files-found: error
